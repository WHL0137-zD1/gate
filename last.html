<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Портал | вход в тихую комнату</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background-image 0.8s ease-in-out;
            background-image: url('images/closendore.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }

        .gate-container {
            position: relative;
            z-index: 2;
            max-width: 550px;
            width: 100%;
            background: rgba(10, 15, 25, 0.85);
            backdrop-filter: blur(5px);
            border: 1px solid #5a8aba;
            border-radius: 32px;
            padding: 30px 25px;
            box-shadow: 0 0 30px rgba(0, 50, 80, 0.4);
            text-align: center;
            transition: all 0.3s;
        }


        body.door-open {
            background-image: url('images/liteinend.png');
        }

        body.door-open::before {
            background: rgba(0, 0, 0, 0.3);
        }

        .gate-container.door-open {
            background: rgba(5, 10, 20, 0.7);
            border-color: #8db5e5;
            box-shadow: 0 0 40px rgba(100, 200, 255, 0.3);
        }

        h1 {
            color: #aaccee;
            font-weight: normal;
            letter-spacing: 3px;
            font-size: 22px;
            border-bottom: 1px dashed #4a7a9a;
            display: inline-block;
            padding-bottom: 8px;
            margin-bottom: 25px;
        }

        .icon {
            font-size: 48px;
            margin: 15px 0;
            opacity: 0.7;
        }

        p {
            color: #cceeff;
            font-size: 14px;
            line-height: 1.5;
            margin: 15px 0;
        }

        input {
            width: 100%;
            background: #0f1820;
            border: 1px solid #3a6a8a;
            color: #e0f0ff;
            font-family: monospace;
            font-size: 18px;
            padding: 12px;
            margin: 20px 0;
            border-radius: 40px;
            text-align: center;
            letter-spacing: 1px;
        }

        input:focus {
            outline: none;
            border-color: #8db5e5;
            box-shadow: 0 0 8px #5a9aba;
        }

        button {
            background: #1e2f3f;
            border: 1px solid #5a8aba;
            color: #e0f0ff;
            font-family: monospace;
            font-size: 16px;
            padding: 10px 24px;
            cursor: pointer;
            border-radius: 40px;
            transition: 0.2s;
        }

        button:hover {
            background: #2e4a6a;
            border-color: #8db5e5;
            text-shadow: 0 0 4px #aaccee;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: rgba(15, 26, 34, 0.7);
            border-radius: 20px;
            border-left: 4px solid #6a9aba;
            font-size: 14px;
            word-break: break-word;
        }

        .welcome {
            color: #aaffaa;
            font-size: 18px;
            margin-bottom: 12px;
        }

        .link a {
            color: #8db5e5;
            text-decoration: none;
            border-bottom: 1px dotted #8db5e5;
        }

        .link a:hover {
            color: #aaccee;
            border-bottom: 1px solid #aaccee;
        }

        .error {
            color: #ffaa88;
        }

        .footer {
            margin-top: 20px;
            font-size: 10px;
            color: #6a8aaa;
        }
    </style>
</head>
<body>
<div class="gate-container" id="gateContainer">
    <h1> ТИХАЯ КОМНАТА</h1>
    <p>Ты собрал все осколки сигнала. Теперь остался последний шаг.</p>
    <p>Введи код, который ты получил из видео и стены обсерватории.</p>

    <input type="text" id="keyInput" placeholder="КЛЮЧ ДОСТУПА" autocomplete="off">
    <button id="unlockBtn">АКТИВИРОВАТЬ</button>

    <div id="resultArea" class="result" style="display: none;"></div>
    <div class="footer">ключ собирается из двух половин. не торопись.</div>
</div>

<script>

    const encryptedData = "U\u0004\u001bS\u0002AUC\u000fWB]\u0002Y\nA\u001fb\u0006%\u0012";
    
    function xorDecrypt(data, key) {
        let result = "";
        for (let i = 0; i < data.length; i++) {
            result += String.fromCharCode(data.charCodeAt(i) ^ key.charCodeAt(i % key.length));
        }
        return result;
    }
    
    const keyInput = document.getElementById('keyInput');
    const unlockBtn = document.getElementById('unlockBtn');
    const resultDiv = document.getElementById('resultArea');
    const gateContainer = document.getElementById('gateContainer');
    
    unlockBtn.addEventListener('click', () => {
        const userKey = keyInput.value.trim();
        if (userKey === "") {
            resultDiv.style.display = "block";
            resultDiv.innerHTML = "<span class='error'> Поле пусто. Введи ключ.</span>";
            return;
        }
        
        const decrypted = xorDecrypt(encryptedData, userKey);
        
        if (decrypted.startsWith("discord.gg/")) {
            const inviteLink = `https://${decrypted}`;

            document.body.classList.add('door-open');
            gateContainer.classList.add('door-open');
            
            resultDiv.style.display = "block";
            resultDiv.innerHTML = `
                <div class="welcome"> Путник, добро пожаловать... домой.</div>
                <div class="link">Твоя дверь: <a href="${inviteLink}" target="_blank">${inviteLink}</a></div>
                <div style="margin-top: 15px; font-size: 12px;">Ты не один. Заходи, здесь тихо.</div>
            `;
        } else {
            resultDiv.style.display = "block";
            resultDiv.innerHTML = "<span class='error'>❌ Ключ неверен. Расшифровка не дала ссылку. Проверь ключ и попробуй снова.</span>";
        }
    });
    
    keyInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') unlockBtn.click();
    });
    
    keyInput.focus();
</script>
</body>
</html>
